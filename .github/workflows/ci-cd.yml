name: CI/CD

on:
  push:
    branches:
      - main
      - feature/**

jobs:
  test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install
      - run: npm test
      - run: npm run lint

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: test
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - run: npm install
      - run: echo "Deploying to staging..."
      - run: echo "Deployment complete"
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}